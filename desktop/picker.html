<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Bildschirm teilen</title>
<link rel="stylesheet" href="assets/securecom-base.css">
<link rel="stylesheet" href="window.css">
<link rel="stylesheet" href="picker.css">
<script src="assets/securecom-boot.js"></script>
</head>
<body>
<header class="sc-titlebar">
  <span>BILDSCHIRM TEILEN</span>
</header>
<main class="pk">
  <p class="pk-intro">Was sollen die anderen sehen? Übertragen wird nur, was du hier wählst – Ende-zu-Ende verschlüsselt.</p>
  <div class="pk-scroll">
    <p class="pk-group" id="pk-screens-head">BILDSCHIRME</p>
    <div class="pk-grid" id="pk-screens"></div>
    <p class="pk-group" id="pk-windows-head">FENSTER</p>
    <div class="pk-grid" id="pk-windows"></div>
  </div>
  <footer class="pk-foot">
    <div class="pk-options">
      <div class="pk-quality"><span class="pk-label" id="pk-quality-label">QUALITÄT</span><div class="pk-choice" id="pk-quality"></div></div>
      <label class="pk-audio" id="pk-audio-row" hidden><input type="checkbox" id="pk-audio" checked> Ton des Computers mitsenden</label>
    </div>
    <div class="pk-actions">
      <span class="pk-note" id="pk-quality-note"></span>
      <button type="button" class="btn" id="pk-cancel">Abbrechen</button>
      <button type="button" class="btn btn--primary" id="pk-share" disabled>Teilen</button>
    </div>
  </footer>
</main>
<script src="picker.js"></script>
</body>
</html>
