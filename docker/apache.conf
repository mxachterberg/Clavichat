# SecureCom im Container – Ergänzungen zur Apache-Einstellung des Images.

# Keine Versionsangaben nach außen.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Die .htaccess von SecureCom gilt (Sperren für lib/, Einstellungen, Typen).
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
