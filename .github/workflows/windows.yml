# Baut die Windows-App und den Windows-Server, sobald ein Versions-Tag
# (z. B. v1.3.0) hochgeladen wird, und legt beides als Entwurf unter
# "Releases" ab. Keine Bausteine von Dritten – nur die offiziellen
# GitHub-Actions (per Commit-SHA festgelegt, Dependabot hält sie aktuell)
# und die GitHub-Kommandozeile.
# Mit dem Secret CLAVICHAT_UPDATE_KEY liegt eine signierte update.json dabei;
# sobald der Entwurf veröffentlicht ist, holen sich die Apps (alle Fassungen
# nach 1.8.2) das Update von dort.
#
# Drei getrennte Jobs, damit Code aus den Abhängigkeiten nie an den
# Signierschlüssel kommt:
#   build   – Windows, npm ci + electron-builder (fremder Code), nur
#             Leserechte, kein Secret; gibt die fertigen Dateien als
#             Artefakte weiter.
#   sign    – frischer Runner im Environment release-signing, ohne npm ci und
#             ohne node_modules: nur das Repo (eigene Skripte mit Node-
#             Bordmitteln) und die Artefakte. Nur hier gibt es das Secret.
#   release – einziger Job mit Schreibrecht; führt nichts aus dem Repo oder
#             aus den Artefakten aus, legt nur den Entwurf an.
name: Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      # PHP für den Server: offizielles Paket, gegen die feste SHA-256 geprüft.
      - run: node scripts/fetch-php.js
      - run: npx electron-builder --win nsis portable --publish never
      - run: npx electron-builder --config host/builder.json --win nsis portable --publish never
      # App: Installer und portable Fassung, dazu das Programmpaket fürs
      # kleine Update (publish-update.js packt es; liegt ein app.asar.unpacked
      # daneben, gibt es nur das volle Update – deshalb kommt es mit).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: |
            desktop/dist/*.exe
            desktop/dist/win-unpacked/resources/app.asar
            desktop/dist/win-unpacked/resources/app.asar.unpacked
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: desktop/dist-server/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Signierte Update-Liste fürs Release: Die App holt Updates vom neuesten
  # veröffentlichten Release (desktop/updater.js). Der private Schlüssel
  # kommt nur in diesem Schritt aus dem Secret und wird nie ausgegeben.
  # Ohne Secret gibt es kein update.json – die App sucht dann weiter
  # nur auf clavichat.de.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Bewusst kein npm ci: publish-update.js und update-key.js brauchen nur
      # Node-Bordmittel, die Electron-Fassung steht in package-lock.json.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: desktop/dist
      - name: Update-Liste signieren
        id: sign
        shell: bash
        env:
          CLAVICHAT_UPDATE_KEY: ${{ secrets.CLAVICHAT_UPDATE_KEY }}
        run: |
          if [ -z "$CLAVICHAT_UPDATE_KEY" ]; then
            echo "::notice::Secret CLAVICHAT_UPDATE_KEY fehlt – Release ohne update.json (keine Updates über GitHub)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($PKG)."
            exit 1
          fi
          node scripts/publish-update.js release
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: desktop/release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      # Nur für CHANGELOG.md (Text des Releases) – daraus läuft kein Code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: desktop/dist-server
      # Mit Signatur: die Dateien aus dem Signier-Job (Namen mit Version),
      # sonst wie bisher die aus dem Build.
      - if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: desktop/release
      - if: needs.sign.outputs.signed != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: desktop/dist
      - name: Release-Entwurf anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Text des Releases: der Abschnitt dieser Version aus CHANGELOG.md
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' ../CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Keine Einträge in CHANGELOG.md für $VERSION." > notes.md
          {
            echo
            echo "---"
            echo "Clavichat (App) und Clavichat Server für Windows, gebaut von GitHub Actions aus genau diesem Stand. Nicht signiert: Windows SmartScreen fragt beim ersten Start nach. Docker: ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          } >> notes.md
          # Mit signierter Liste: genau die Dateien, die update.json nennt
          # (Namen mit Versionsnummer), sonst wie bisher alles aus dist/.
          shopt -s nullglob   # kein kleines Update gebaut: kein *.asar.gz
          if [ -f release/update.json ]; then
            APP=(release/update.json release/Clavichat-*.exe release/Clavichat-*.asar.gz)
          else
            APP=(dist/*.exe)
          fi
          # Ein Entwurf: Erst das Veröffentlichen macht ihn zu
          # releases/latest – und damit zum Update für alle.
          gh release create "$GITHUB_REF_NAME" "${APP[@]}" dist-server/*.exe \
            --draft --title "Clavichat $GITHUB_REF_NAME" --notes-file notes.md
