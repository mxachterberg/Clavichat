# Baut das Server-Image (amd64 und arm64, etwa für den Raspberry Pi) bei
# jedem Versions-Tag und legt es in der GitHub Container Registry ab:
#   ghcr.io/<besitzer>/clavichat:<version> und :latest
# Nur Bordmittel des Runners (docker buildx) – keine fremden Actions.
name: Docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vor dem Anmelden: Dieser Container läuft mit --privileged und soll das
      # Token für ghcr.io nie zu sehen bekommen. Festgelegt per Digest
      # (tonistiigi/binfmt:qemu-v10.2.3, am 08.06.2026 auch :latest). Neue
      # Fassung: Digest des Tags aus Docker Hub übernehmen.
      - name: Emulation für arm64
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - name: Anmelden bei ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Bauen und hochladen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx create --use --name clavichat
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.version=$VERSION" \
            --push .
