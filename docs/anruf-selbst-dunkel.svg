<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img">
<title>Clavichat selbst betrieben</title>
<desc>Mit eigenem Server und eigenem Relay (coturn oder Cloudflare mit eigenem Schlüssel) läuft alles wie beim offiziellen Server: Das Angebot geht PGP-verschlüsselt über deinen Server, Ton und Bild direkt oder über dein Relay. IP-Adressen sehen nur du und dein Hoster.</desc>
<style>
.bg{fill:#0b0b0d}
.grid{fill:none;stroke:rgba(255,255,255,.035);stroke-width:1}
.box{fill:#101013;stroke:#242427;stroke-width:1}
.tick{fill:none;stroke:#f97316;stroke-width:1}
.t{font:500 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.14em;fill:#ededec}
.s{font:400 12.5px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6f6f77}
.l{font:400 10.5px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.1em;fill:#6f6f77}
.la{fill:#f97316}
.lg{fill:#4ade80}
.head{font:400 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.16em;fill:#6f6f77}
.sq{fill:#f97316}
.rule{stroke:#242427;stroke-width:1}
.sep{stroke:#1b1b1e;stroke-width:1}
.row{font:500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.12em;fill:#ededec}
.cell{font:400 13px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#a2a2a7}
.note{font:400 12.5px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6f6f77}
.sig{fill:none;stroke:#6f6f77;stroke-width:1;stroke-dasharray:3 4}
.dir{fill:none;stroke:#f97316;stroke-width:1.6;stroke-dasharray:6 5}
.rel{fill:none;stroke:#4ade80;stroke-width:1.6;stroke-dasharray:6 5}
.seal{fill:none;stroke:#f97316;stroke-width:2}
.lock path{fill:none;stroke:#f97316;stroke-width:1.4}
.lock rect{fill:#101013;stroke:#f97316;stroke-width:1.4}
.lock.g path,.lock.g rect{stroke:#4ade80}
</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="grid" d="M40 0H0V40"/></pattern></defs>
<rect class="bg" width="880" height="530"/>
<rect width="880" height="530" fill="url(#grid)"/>
<rect class="sq" x="40" y="32" width="8" height="8"/>
<text x="62" y="36" class="head" text-anchor="start" dominant-baseline="central">SELBST BETRIEBEN: EIGENER SERVER, EIGENES RELAY</text>
<path class="rule" d="M508.4 36H840"/>
<path class="sig" d="M135 196V112H341"/>
<path class="sig" d="M539 112H745V196"/>
<text x="238" y="98" class="l" text-anchor="middle" dominant-baseline="central">ANGEBOT · ANTWORT</text>
<text x="642" y="98" class="l" text-anchor="middle" dominant-baseline="central">PGP-VERSCHLÜSSELT</text>
<path class="dir" d="M234 232H646"/>
<text x="440" y="214" class="l la" text-anchor="middle" dominant-baseline="central">OHNE „IP VERBERGEN“: DIREKT</text>
<text x="440" y="250" class="l la" text-anchor="middle" dominant-baseline="central">DAS GEGENÜBER SIEHT DEINE IP</text>
<path class="rel" d="M135 268V352H341"/>
<path class="rel" d="M539 352H745V268"/>
<text x="238" y="338" class="l lg" text-anchor="middle" dominant-baseline="central">MIT „IP VERBERGEN“</text>
<text x="642" y="338" class="l lg" text-anchor="middle" dominant-baseline="central">SIEHT NUR DAS RELAY</text>
<rect class="box" x="40" y="200" width="190" height="64"/>
<path class="tick" d="M35.5 200h9M40 195.5v9"/>
<path class="tick" d="M225.5 264h9M230 259.5v9"/>
<text x="135" y="222" class="t" text-anchor="middle" dominant-baseline="central">DU</text>
<text x="135" y="244" class="s" text-anchor="middle" dominant-baseline="central">dein Gerät</text>
<rect class="box" x="345" y="80" width="190" height="64"/>
<path class="tick" d="M340.5 80h9M345 75.5v9"/>
<path class="tick" d="M530.5 144h9M535 139.5v9"/>
<text x="440" y="102" class="t" text-anchor="middle" dominant-baseline="central">DEIN SERVER</text>
<text x="440" y="124" class="s" text-anchor="middle" dominant-baseline="central">Webspace · Docker · Windows</text>
<rect class="box" x="650" y="200" width="190" height="64"/>
<path class="tick" d="M645.5 200h9M650 195.5v9"/>
<path class="tick" d="M835.5 264h9M840 259.5v9"/>
<text x="745" y="222" class="t" text-anchor="middle" dominant-baseline="central">GEGENÜBER</text>
<text x="745" y="244" class="s" text-anchor="middle" dominant-baseline="central">sein Gerät</text>
<rect class="box" x="345" y="320" width="190" height="64"/>
<path class="tick" d="M340.5 320h9M345 315.5v9"/>
<path class="tick" d="M530.5 384h9M535 379.5v9"/>
<text x="440" y="342" class="t" text-anchor="middle" dominant-baseline="central">DEIN RELAY</text>
<text x="440" y="364" class="s" text-anchor="middle" dominant-baseline="central">coturn oder Cloudflare</text>
<path class="dir" d="M40 430H66"/>
<text x="76" y="430" class="note" text-anchor="start" dominant-baseline="central">direkt – das Gegenüber sieht deine IP</text>
<path class="rel" d="M335 430H361"/>
<text x="371" y="430" class="note" text-anchor="start" dominant-baseline="central">über das Relay – es sieht nur das Relay</text>
<path class="sig" d="M640 430H666"/>
<text x="676" y="430" class="note" text-anchor="start" dominant-baseline="central">Vermittlung (verschlüsselt)</text>
<text x="40" y="466" class="note" text-anchor="start" dominant-baseline="central">Server und Relay betreibst du: IP-Adressen und Zeitpunkte sehen nur du und dein Hoster – Inhalte niemand.</text>
<text x="40" y="492" class="note la" text-anchor="start" dominant-baseline="central">Zu Hause betrieben und aus dem Internet erreichbar, sehen alle Nutzer deine Heim-IP.</text>
</svg>
