<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img">
<title>So läuft ein Anruf bei Clavichat</title>
<desc>Das Verbindungsangebot läuft PGP-verschlüsselt über den Server. Ton und Bild laufen direkt zwischen den Geräten – dann sieht das Gegenüber deine IP – oder mit „IP verbergen“ über das Relay, das nur verschlüsselte Pakete sieht.</desc>
<style>
.bg{fill:#f6f6f4}
.grid{fill:none;stroke:rgba(0,0,0,.045);stroke-width:1}
.box{fill:#fbfbfa;stroke:#dedcd7;stroke-width:1}
.tick{fill:none;stroke:#d1580c;stroke-width:1}
.t{font:500 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.14em;fill:#17171a}
.s{font:400 12.5px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#83838c}
.l{font:400 10.5px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.1em;fill:#83838c}
.la{fill:#d1580c}
.lg{fill:#2f9e52}
.head{font:400 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.16em;fill:#83838c}
.sq{fill:#d1580c}
.rule{stroke:#dedcd7;stroke-width:1}
.sep{stroke:#e7e5e0;stroke-width:1}
.row{font:500 11px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.12em;fill:#17171a}
.cell{font:400 13px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#55555c}
.note{font:400 12.5px Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#83838c}
.sig{fill:none;stroke:#83838c;stroke-width:1;stroke-dasharray:3 4}
.dir{fill:none;stroke:#d1580c;stroke-width:1.6;stroke-dasharray:6 5}
.rel{fill:none;stroke:#2f9e52;stroke-width:1.6;stroke-dasharray:6 5}
.seal{fill:none;stroke:#d1580c;stroke-width:2}
.lock path{fill:none;stroke:#d1580c;stroke-width:1.4}
.lock rect{fill:#fbfbfa;stroke:#d1580c;stroke-width:1.4}
.lock.g path,.lock.g rect{stroke:#2f9e52}
</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="grid" d="M40 0H0V40"/></pattern></defs>
<rect class="bg" width="880" height="470"/>
<rect width="880" height="470" fill="url(#grid)"/>
<rect class="sq" x="40" y="32" width="8" height="8"/>
<text x="62" y="36" class="head" text-anchor="start" dominant-baseline="central">SO LÄUFT EIN ANRUF</text>
<path class="rule" d="M241.6 36H840"/>
<path class="sig" d="M135 196V112H341"/>
<path class="sig" d="M539 112H745V196"/>
<text x="238" y="98" class="l" text-anchor="middle" dominant-baseline="central">ANGEBOT · ANTWORT</text>
<text x="642" y="98" class="l" text-anchor="middle" dominant-baseline="central">PGP-VERSCHLÜSSELT</text>
<path class="dir" d="M234 232H646"/>
<text x="440" y="214" class="l la" text-anchor="middle" dominant-baseline="central">OHNE „IP VERBERGEN“: DIREKT</text>
<text x="440" y="250" class="l la" text-anchor="middle" dominant-baseline="central">DAS GEGENÜBER SIEHT DEINE IP</text>
<path class="rel" d="M135 268V352H341"/>
<path class="rel" d="M539 352H745V268"/>
<text x="238" y="338" class="l lg" text-anchor="middle" dominant-baseline="central">MIT „IP VERBERGEN“</text>
<text x="642" y="338" class="l lg" text-anchor="middle" dominant-baseline="central">SIEHT NUR DAS RELAY</text>
<rect class="box" x="40" y="200" width="190" height="64"/>
<path class="tick" d="M35.5 200h9M40 195.5v9"/>
<path class="tick" d="M225.5 264h9M230 259.5v9"/>
<text x="135" y="222" class="t" text-anchor="middle" dominant-baseline="central">DU</text>
<text x="135" y="244" class="s" text-anchor="middle" dominant-baseline="central">dein Gerät</text>
<rect class="box" x="345" y="80" width="190" height="64"/>
<path class="tick" d="M340.5 80h9M345 75.5v9"/>
<path class="tick" d="M530.5 144h9M535 139.5v9"/>
<text x="440" y="102" class="t" text-anchor="middle" dominant-baseline="central">SERVER</text>
<text x="440" y="124" class="s" text-anchor="middle" dominant-baseline="central">nur Vermittlung</text>
<rect class="box" x="650" y="200" width="190" height="64"/>
<path class="tick" d="M645.5 200h9M650 195.5v9"/>
<path class="tick" d="M835.5 264h9M840 259.5v9"/>
<text x="745" y="222" class="t" text-anchor="middle" dominant-baseline="central">GEGENÜBER</text>
<text x="745" y="244" class="s" text-anchor="middle" dominant-baseline="central">sein Gerät</text>
<rect class="box" x="345" y="320" width="190" height="64"/>
<path class="tick" d="M340.5 320h9M345 315.5v9"/>
<path class="tick" d="M530.5 384h9M535 379.5v9"/>
<text x="440" y="342" class="t" text-anchor="middle" dominant-baseline="central">RELAY (TURN)</text>
<text x="440" y="364" class="s" text-anchor="middle" dominant-baseline="central">z. B. Cloudflare</text>
<path class="dir" d="M40 430H66"/>
<text x="76" y="430" class="note" text-anchor="start" dominant-baseline="central">direkt – das Gegenüber sieht deine IP</text>
<path class="rel" d="M335 430H361"/>
<text x="371" y="430" class="note" text-anchor="start" dominant-baseline="central">über das Relay – es sieht nur das Relay</text>
<path class="sig" d="M640 430H666"/>
<text x="676" y="430" class="note" text-anchor="start" dominant-baseline="central">Vermittlung (verschlüsselt)</text>
</svg>
